                const h = Math.random() * CONFIG.treeHeight;
                const y = h - CONFIG.treeHeight / 2;
                let radiusRatio = (type === 'gold') ? Math.sqrt(Math.random()) : 0.9 + Math.random() * 0.1;
                const maxR = (1 - (h / CONFIG.treeHeight)) * CONFIG.treeBaseRadius;
                const r = maxR * radiusRatio;
                const theta = Math.random() * Math.PI * 2;
                pTreeTargets.push(r * Math.cos(theta), y, r * Math.sin(theta));

                // --- EXPLODE Vandiep ---
                const u = Math.random();
                const v = Math.random();
                const phi = Math.acos(2 * v - 1);
                const lam = 2 * Math.PI * u;
                let radMult = (type === 'gift') ? 1.2 : 1.0;
                const rad = CONFIG.explodeRadius * Math.cbrt(Math.random()) * radMult;
                pExplodeTargets.push(rad * Math.sin(phi) * Math.cos(lam), rad * Math.sin(phi) * Math.sin(lam), rad * Math.cos(phi));

                // --- SOFT HEART Vandiep ---
                const tHeart = Math.random() * Math.PI * 2;
                let hx = 16 * Math.pow(Math.sin(tHeart), 3);
                let hy = 13 * Math.cos(tHeart) - 5 * Math.cos(2 * tHeart) - 2 * Math.cos(3 * tHeart) - Math.cos(4 * tHeart);

                const rFill = Math.pow(Math.random(), 0.3); // Soft fill Vandiep
                hx *= rFill; hy *= rFill;
                let hz = (Math.random() - 0.5) * 8 * rFill;

                const noise = 1.0;
                hx += (Math.random() - 0.5) * noise;
                hy += (Math.random() - 0.5) * noise;
                hz += (Math.random() - 0.5) * noise;

                const scaleH = 2.2;
                pHeartTargets.push(hx * scaleH, hy * scaleH + 5, hz);

                // A tight glowing seed used by the one-shot secret reveal.
                const gatherAngle = Math.random() * Math.PI * 2;
                const gatherRadius = Math.pow(Math.random(), 1.8) * 2.4;
                pSecretGatherTargets.push(
                    Math.cos(gatherAngle) * gatherRadius,
                    Math.sin(gatherAngle) * gatherRadius,
                    (Math.random() - 0.5) * 1.8
                );

                // --- SELECTABLE FLOWERS ---
                flowerTypes.forEach(flowerType => {
                    const point = createFlowerPoint(flowerType);
                    flowerTargets[flowerType].push(point.x, point.y, point.z);
                    flowerColors[flowerType].push(point.color.r, point.color.g, point.color.b);
                });

                // --- INIT Vandiep ---
                const initialTargets = flowerTargets[selectedFlowerType];
                pPositions.push(initialTargets[i * 3], initialTargets[i * 3 + 1], initialTargets[i * 3 + 2]);
                sizes.push(size);
                phases.push(Math.random() * Math.PI * 2);
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pPositions, 3));
            geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            // Init colors Vandiep
            const colors = new Float32Array(count * 3);
            const baseColor = new THREE.Color();
            if (type === 'gold') baseColor.setHex(0xFFD700);
            else if (type === 'red') baseColor.setHex(0xFF0000);
            else baseColor.setHex(0xFFFFFF);

            for (let i = 0; i < count; i++) {
                colors[i * 3] = baseColor.r;
                colors[i * 3 + 1] = baseColor.g;
                colors[i * 3 + 2] = baseColor.b;
            }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const flowerGeometryData = {};
            flowerTypes.forEach(flowerType => {
                flowerGeometryData[flowerType] = flowerTargets[flowerType];
                flowerGeometryData[`${flowerType}Colors`] = flowerColors[flowerType];
            });

            geo.userData = {
                tree: pTreeTargets,
                explode: pExplodeTargets,
                heart: pHeartTargets,
                secretGather: pSecretGatherTargets,
                ...flowerGeometryData,
                phases: phases, baseColor: baseColor, baseSize: size
            };

            const mat = new THREE.PointsMaterial({
                size: size,
                map: textures[type],
                transparent: true, opacity: 1.0,
                vertexColors: true,
                blending: (type === 'gift') ? THREE.NormalBlending : THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);
            return points;
        }

        function createPhotos() {
            const geo = new THREE.PlaneGeometry(8, 8);
            const borderGeo = new THREE.PlaneGeometry(9, 9);
            const borderMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 });

            for (let i = 0; i < photoFiles.length; i++) {
                const mat = new THREE.MeshBasicMaterial({ map: photoTextures[i], side: THREE.DoubleSide });
                const mesh = new THREE.Mesh(geo, mat);
                const border = new THREE.Mesh(borderGeo, borderMat);
                border.position.z = -0.1;
                mesh.add(border);
                mesh.visible = false; mesh.scale.set(0, 0, 0);
                scene.add(mesh);
                photoMeshes.push(mesh);
            }
        }

        function createDecorations() {
            // MERRY CHRISTMAS Vandiep
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold italic 90px "Times New Roman"';
            ctx.fillStyle = '#FFD700'; ctx.textAlign = 'center';
            ctx.shadowColor = "#FF0000"; ctx.shadowBlur = 40;
            ctx.fillText("Gửi Duyên 💌", 1024, 130);
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending });
            titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(110, 15), mat);
            titleMesh.position.set(0, 50, 0);
            scene.add(titleMesh);

            // STAR Vandiep
            const starCanvas = document.createElement('canvas');
            starCanvas.width = 128; starCanvas.height = 128;
            const sCtx = starCanvas.getContext('2d');
            sCtx.fillStyle = "#FFFF00"; sCtx.shadowColor = "#FFF"; sCtx.shadowBlur = 20;
            sCtx.beginPath();
            const cx = 64, cy = 64, outer = 50, inner = 20;
            for (let i = 0; i < 5; i++) {
                sCtx.lineTo(cx + Math.cos((18 + i * 72) / 180 * Math.PI) * outer, cy - Math.sin((18 + i * 72) / 180 * Math.PI) * outer);
                sCtx.lineTo(cx + Math.cos((54 + i * 72) / 180 * Math.PI) * inner, cy - Math.sin((54 + i * 72) / 180 * Math.PI) * inner);
            }
            sCtx.closePath(); sCtx.fill();
            const starTex = new THREE.CanvasTexture(starCanvas);
            const starMat = new THREE.MeshBasicMaterial({ map: starTex, transparent: true, blending: THREE.AdditiveBlending });
            starMesh = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), starMat);
            starMesh.position.set(0, CONFIG.treeHeight / 2 + 2, 0);
            scene.add(starMesh);

            const loveCanvas = document.createElement('canvas');
            loveCanvas.width = 1024; loveCanvas.height = 256;
            const lCtx = loveCanvas.getContext('2d');
            lCtx.font = 'bold 82px "Segoe UI", sans-serif';
            lCtx.fillStyle = '#FF69B4'; lCtx.textAlign = 'center'; lCtx.textBaseline = 'middle';
            lCtx.strokeStyle = 'rgba(0, 0, 0, 0.9)'; lCtx.lineWidth = 8;
            lCtx.shadowColor = 'rgba(0, 0, 0, 0.95)'; lCtx.shadowBlur = 24;
            lCtx.shadowOffsetX = 0; lCtx.shadowOffsetY = 6;
            const proposalLines = ['Làm người yêu', 'anh nhé ❤️'];
            const lineHeight = 92;
            const centerX = loveCanvas.width / 2;
            const startY = loveCanvas.height / 2 - ((proposalLines.length - 1) * lineHeight) / 2;
            proposalLines.forEach((line, index) => {
                const y = startY + index * lineHeight;
                lCtx.strokeText(line, centerX, y);
                lCtx.fillText(line, centerX, y);
            });
            const loveTex = new THREE.CanvasTexture(loveCanvas);
            const loveMat = new THREE.MeshBasicMaterial({ map: loveTex, transparent: true, blending: THREE.NormalBlending, depthWrite: false });
            loveMesh = new THREE.Mesh(new THREE.PlaneGeometry(70, 18), loveMat);
            loveMesh.position.set(0, 0, 20);
            loveMesh.visible = false;
            scene.add(loveMesh);
        }

        function updateParticleGroup(group, type, targetState, speed, handRotY, time) {
            const positions = group.geometry.attributes.position.array;
            const sizes = group.geometry.attributes.size.array;
            const colors = group.geometry.attributes.color.array;
            const phases = group.geometry.userData.phases;
            const baseColor = group.geometry.userData.baseColor;
            const baseSize = group.geometry.userData.baseSize;

            const targetKey = (targetState === 'PHOTO')
                ? 'explode'
                : (targetState === 'SECRET_GATHER')
                    ? 'secretGather'
                    : (targetState === 'FLOWER' ? selectedFlowerType : targetState.toLowerCase());
            const targets = group.geometry.userData[targetKey];
            const targetTexture = (
                targetState === 'FLOWER'
                || targetState === 'HEART'
                || targetState === 'SECRET_GATHER'
            ) ? textures.neutral : textures[type];
            if (group.material.map !== targetTexture) {
                group.material.map = targetTexture;
                group.material.needsUpdate = true;
            }

            const targetChanged = group.userData.lastTargetKey !== targetKey;
            if (targetChanged) {
                group.userData.lastTargetKey = targetKey;
                group.userData.positionsSettled = false;
            }

            // Stop uploading an unchanged position buffer after a transition
            // has settled. This removes a continuous GPU upload on mobile.
            if (!group.userData.positionsSettled) {
                let largestRemainingDistance = 0;
                for (let i = 0; i < positions.length; i++) {
                    const remainingDistance = targets[i] - positions[i];
                    positions[i] += remainingDistance * speed;
                    largestRemainingDistance = Math.max(largestRemainingDistance, Math.abs(remainingDistance));
                }
                group.geometry.attributes.position.needsUpdate = true;
                if (largestRemainingDistance < 0.002) group.userData.positionsSettled = true;
            }

            // 2. COLOR & SIZE Vandiep
            const count = positions.length / 3;
            const visualKey = `${targetState}:${selectedFlowerType}:${isHeartGestureActive}`;
            const visualChanged = group.userData.lastVisualKey !== visualKey;
            group.userData.lastVisualKey = visualKey;

            if (targetState === 'SECRET_GATHER') {
                group.scale.set(1, 1, 1);
                group.rotation.y += 0.008;

                if (visualChanged) {
                    for (let i = 0; i < count; i++) {
                        sizes[i] = baseSize * 0.72;
                        colors[i * 3] = gestureHeartColor.r;
                        colors[i * 3 + 1] = 0.72 + gestureHeartColor.g * 0.28;
                        colors[i * 3 + 2] = gestureHeartColor.b;
                    }
                    group.geometry.attributes.color.needsUpdate = true;
                    group.geometry.attributes.size.needsUpdate = true;
                }

            } else if (targetState === 'FLOWER') {
                group.scale.set(1, 1, 1);
                group.rotation.y += 0.002;
                const flowerColors = group.geometry.userData[`${selectedFlowerType}Colors`];

                if (visualChanged) {
                    for (let i = 0; i < count; i++) {
                        sizes[i] = baseSize;
                        colors[i * 3] = flowerColors[i * 3];
                        colors[i * 3 + 1] = flowerColors[i * 3 + 1];
                        colors[i * 3 + 2] = flowerColors[i * 3 + 2];
                    }
                    group.geometry.attributes.color.needsUpdate = true;
                    group.geometry.attributes.size.needsUpdate = true;
                }

            } else if (targetState === 'TREE') {
                group.rotation.y += 0.003;

                for (let i = 0; i < count; i++) {
                    sizes[i] = baseSize;
                    let brightness = 1.0;
                    if (type === 'red') {
                        // RED
                        brightness = 0.5 + 0.5 * Math.sin(time * 3 + phases[i]);
                    } else if (type === 'gold') {
                        // YELLOW
                        brightness = 0.8 + 0.4 * Math.sin(time * 10 + phases[i]);
                    }
                    colors[i * 3] = baseColor.r * brightness;
                    colors[i * 3 + 1] = baseColor.g * brightness;
                    colors[i * 3 + 2] = baseColor.b * brightness;
                }
                group.geometry.attributes.color.needsUpdate = true;
                group.geometry.attributes.size.needsUpdate = true;

            } else if (targetState === 'HEART') {
                group.rotation.y = 0;
                const beatScale = 1 + Math.abs(Math.sin(time * 3)) * 0.15;
                group.scale.set(beatScale, beatScale, beatScale);

                // Vandiep
                const heartColor = isHeartGestureActive ? gestureHeartColor : baseColor;
                if (visualChanged) {
                    for (let i = 0; i < count; i++) {
                        colors[i * 3] = heartColor.r; colors[i * 3 + 1] = heartColor.g; colors[i * 3 + 2] = heartColor.b;
                        if (i % 3 === 0) sizes[i] = baseSize;
                        else sizes[i] = 0;
                    }
                    group.geometry.attributes.color.needsUpdate = true;
                    group.geometry.attributes.size.needsUpdate = true;
                }

            } else {
                // EXPLODE
                group.scale.set(1, 1, 1);
                group.rotation.y += (handRotY - group.rotation.y) * 0.1;

                // size, color
                for (let i = 0; i < count; i++) {
                    sizes[i] = baseSize;
                    let brightness = 1.0;
                    if (type === 'gold' || type === 'red') {
                        brightness = 0.8 + 0.5 * Math.sin(time * 12 + phases[i]);
                    }
                    colors[i * 3] = baseColor.r * brightness;
                    colors[i * 3 + 1] = baseColor.g * brightness;
                    colors[i * 3 + 2] = baseColor.b * brightness;
                }
                group.geometry.attributes.size.needsUpdate = true;
                group.geometry.attributes.color.needsUpdate = true;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const animationNow = performance.now();
            const time = Date.now() * 0.001;
            const speed = 0.08;

            updateSecretReveal(animationNow);
            updatePetalStateEffects(animationNow);

            // --- ĐOẠN SỬA ĐỔI: Logic lướt ảnh liên tục ---
            // Nếu tay ở giữa (0.5) -> Tốc độ = 0
            // Tay sang trái/phải -> Tăng/Giảm góc quay (tạo hiệu ứng trôi)
            // Số 0.05 là độ nhạy, bạn có thể chỉnh lên 0.1 nếu muốn lướt nhanh hơn
            if (state === 'EXPLODE' || state === 'PHOTO') {
                worldRotation += (handX - 0.5) * 0.08;
            } else {
                // Khi về dạng Hoa hoặc Tim, tự động xoay nhẹ cho đẹp
                worldRotation += 0.002;
            }

            // Gán giá trị góc quay mới vào biến cũ để hệ thống xử lý
            const handRotY = worldRotation;
            // ----------------------------------------------

            updateParticleGroup(groupGold, 'gold', state, speed, handRotY, time);
            updateParticleGroup(groupRed, 'red', state, speed, handRotY, time);
            updateParticleGroup(groupGift, 'gift', state, speed, handRotY, time);

            photoMeshes.forEach((mesh, i) => {
                if (!mesh.material.map && photoTextures[i]) {
                    mesh.material.map = photoTextures[i]; mesh.material.needsUpdate = true;
                }
            });

            if (state === 'SECRET_GATHER') {
                titleMesh.visible = false; starMesh.visible = false; loveMesh.visible = false;
                photoMeshes.forEach(m => { m.scale.set(0, 0, 0); m.visible = false; });

            } else if (state === 'FLOWER') {
                titleMesh.visible = false; starMesh.visible = false; loveMesh.visible = false;
                photoMeshes.forEach(m => { m.scale.lerp(new THREE.Vector3(0, 0, 0), 0.1); m.visible = false; });

            } else if (state === 'TREE') {
                titleMesh.visible = true; starMesh.visible = true; loveMesh.visible = false;
                titleMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                starMesh.rotation.z -= 0.02;
                starMesh.material.opacity = 0.7 + 0.3 * Math.sin(time * 5);
                photoMeshes.forEach(m => { m.scale.lerp(new THREE.Vector3(0, 0, 0), 0.1); m.visible = false; });

            } else if (state === 'HEART') {
                const messageProgress = secretRevealActive ? getSecretRevealMessageProgress() : 1;
                const easedMessageProgress = 1 - Math.pow(1 - messageProgress, 3);
                const shouldShowMessage = secretRevealActive
                    ? messageProgress > 0
                    : isHeartGestureActive;
                titleMesh.visible = false; starMesh.visible = false; loveMesh.visible = shouldShowMessage;
                photoMeshes.forEach(m => { m.visible = false; });
                loveMesh.material.opacity = easedMessageProgress;
                const heartbeatScale = 1 + Math.abs(Math.sin(time * 3)) * 0.1;
                const messageScale = (0.72 + easedMessageProgress * 0.28) * heartbeatScale;
                loveMesh.scale.set(messageScale, messageScale, 1);

            } else if (state === 'EXPLODE') {
                titleMesh.visible = false; starMesh.visible = false; loveMesh.visible = false;

                // Sử dụng worldRotation làm góc gốc để các ảnh xoay theo
                const baseAngle = groupGold.rotation.y;
                const angleStep = (Math.PI * 2) / photoFiles.length;

                let bestIdx = 0; let maxZ = -999;

                photoMeshes.forEach((mesh, i) => {
                    mesh.visible = true;
                    // Cộng thêm baseAngle để ảnh xoay cùng hạt
                    const angle = baseAngle + i * angleStep;

                    const x = Math.sin(angle) * CONFIG.photoOrbitRadius;
                    const z = Math.cos(angle) * CONFIG.photoOrbitRadius;
                    const y = Math.sin(time + i) * 3;

                    mesh.position.lerp(new THREE.Vector3(x, y, z), 0.1);
                    mesh.lookAt(camera.position);

                    // Logic chọn ảnh gần nhất (để zoom khi giơ ngón trỏ)
                    if (z > maxZ) { maxZ = z; bestIdx = i; }

                    if (z > 5) {
                        const ds = 1.0 + (z / CONFIG.photoOrbitRadius) * 0.8;
                        mesh.scale.lerp(new THREE.Vector3(ds, ds, ds), 0.1);
                    } else {
                        mesh.scale.lerp(new THREE.Vector3(0.6, 0.6, 0.6), 0.1);
                    }
                });
                selectedIndex = bestIdx;

            } else if (state === 'PHOTO') {
                loveMesh.visible = false;
                photoMeshes.forEach((mesh, i) => {
                    if (i === selectedIndex) {
                        // Zoom ảnh được chọn
                        mesh.position.lerp(new THREE.Vector3(0, 0, 60), 0.1);
                        mesh.scale.lerp(new THREE.Vector3(5, 5, 5), 0.1);
                        mesh.lookAt(camera.position); mesh.rotation.z = 0;
                    } else {
                        // Thu nhỏ các ảnh khác
                        mesh.scale.lerp(new THREE.Vector3(0, 0, 0), 0.1);
                    }
                });
            }
            renderer.render(scene, camera);
        }

        function drawCameraFrameCover(context, source, targetWidth, targetHeight) {
            const sourceWidth = source.videoWidth || source.naturalWidth || source.width;
            const sourceHeight = source.videoHeight || source.naturalHeight || source.height;
            if (!sourceWidth || !sourceHeight) return;

            const sourceRatio = sourceWidth / sourceHeight;
            const targetRatio = targetWidth / targetHeight;
            let sourceX = 0;
            let sourceY = 0;
            let cropWidth = sourceWidth;
            let cropHeight = sourceHeight;

            if (sourceRatio > targetRatio) {
                cropWidth = sourceHeight * targetRatio;
                sourceX = (sourceWidth - cropWidth) / 2;
            } else if (sourceRatio < targetRatio) {
                cropHeight = sourceWidth / targetRatio;
                sourceY = (sourceHeight - cropHeight) / 2;
            }

            context.clearRect(0, 0, targetWidth, targetHeight);
            context.drawImage(
                source,
                sourceX,
                sourceY,
                cropWidth,
                cropHeight,
                0,
                0,
                targetWidth,
                targetHeight
            );
        }

        function startSystem() {
            document.body.classList.add('system-started');
            document.getElementById('btnStart').style.display = 'none';
            createPetalBurst(window.innerWidth <= 600 ? 20 : 28, 0.5, 0.56);
            lastPetalBurstAt = performance.now();
            prepareSecretAudio();
            bgMusic.play().catch(e => console.log(e));
            init3D();

            const video = document.getElementsByClassName('input_video')[0];
            const canvas = document.getElementById('camera-preview');
            const ctx = canvas.getContext('2d');
            canvas.classList.add('is-active');

            canvas.width = PERFORMANCE.previewWidth;
            canvas.height = PERFORMANCE.previewHeight;

            // The visible preview stays sharp while MediaPipe receives a
            // separate, smaller 4:3 frame for better mobile performance.
            const analysisCanvas = document.createElement('canvas');
            analysisCanvas.width = PERFORMANCE.analysisWidth;
            analysisCanvas.height = PERFORMANCE.analysisHeight;
            const analysisContext = analysisCanvas.getContext('2d');

            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.45,
                minTrackingConfidence: 0.4
            });

            hands.onResults(results => {
                // --- Hand Logic  ---
                const allHands = results.multiHandLandmarks || [];
                const gestureTime = performance.now();

                // Hai luồng tách biệt: zoom chỉ dùng đúng một bàn tay; trái tim
                // bí mật chỉ dùng đúng hai bàn tay và phải giữ đủ một giây.
                const heartGestureActive = updateHeartGesture(allHands, gestureTime);
                const pointingGestureActive = updatePointingGesture(allHands, gestureTime);
                if (!secretRevealActive && !heartGestureActive) {
                    secretRevealArmed = true;
                }
                if (heartGestureActive && secretRevealArmed) {
                    startSecretReveal(gestureTime);
                }
                if (secretRevealActive) return;
                if (heartGestureActive) {
                    state = 'HEART';
                    return;
                }

                if (allHands.length === 1) {
                    const lm = allHands[0];
                    handX = lm[9].x;
                    const tips = [8, 12, 16, 20]; const wrist = lm[0];
                    let openDist = 0; tips.forEach(i => openDist += Math.hypot(lm[i].x - wrist.x, lm[i].y - wrist.y));
                    const avgDist = openDist / 4;

                    // --- Quyết định trạng thái ---
                    if (pointingGestureActive) {
                        // Đúng một bàn tay trỏ ổn định 350ms -> Xem ảnh
                        state = 'PHOTO';
                    }
                    else if (avgDist < 0.25) {
                        // Nắm tay (Fist) -> Hiện bông hoa
                        state = 'FLOWER';
                    }
                    else {
                        // Xòe tay hoặc các thế tay khác -> Xoay vòng tròn ảnh
                        state = 'EXPLODE';
                    }
                } else if (allHands.length === 2) {
                    // Hai tay chưa giữ đúng cử chỉ đủ 1 giây thì tuyệt đối
                    // không được rơi vào chế độ zoom và làm lộ bất ngờ.
                    state = 'EXPLODE';
                } else {
                    state = 'FLOWER';
                }
            });

            let lastHandsInferenceAt = -Infinity;
            let handsInferenceInFlight = false;
            const cameraUtils = new Camera(video, {
                onFrame: async () => {
                    drawCameraFrameCover(ctx, video, canvas.width, canvas.height);
                    const now = performance.now();
                    if (
                        handsInferenceInFlight
                        || now - lastHandsInferenceAt < PERFORMANCE.handInferenceIntervalMs
                    ) return;

                    lastHandsInferenceAt = now;
                    handsInferenceInFlight = true;
                    try {
                        drawCameraFrameCover(
                            analysisContext,
                            video,
                            analysisCanvas.width,
                            analysisCanvas.height
                        );
                        await hands.send({ image: analysisCanvas });
                    } finally {
                        handsInferenceInFlight = false;
                    }
                },
                width: PERFORMANCE.captureWidth,
                height: PERFORMANCE.captureHeight
            });
            cameraUtils.start();
        }

        window.addEventListener('resize', scheduleSceneResize);
        window.addEventListener('orientationchange', scheduleSceneResize);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', scheduleSceneResize);
        }
        prepareDedicationLetters();
        createAmbientPetals();
    </script>
